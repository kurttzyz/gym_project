<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gym Platform</title>
<style>body{margin:0;background:#f3f5f9;color:#17233a;font:16px system-ui}header{background:#17233a;color:white;padding:20px 6%;display:flex;align-items:center;justify-content:space-between}header a{color:white}main{max-width:1000px;margin:48px auto;padding:0 24px}a{color:#245ac5} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.card{background:white;padding:24px;border-radius:12px;border:1px solid #dce2ec}button,.button{display:inline-block;background:#245ac5;color:white;border:0;border-radius:6px;padding:12px 18px;text-decoration:none;cursor:pointer}input{display:block;padding:10px;max-width:100%;box-sizing:border-box}header form{margin:0}.errorlist{color:#a32020}</style></head>
<body><header><a href="{% url 'dashboard' %}">Gym Platform</a>{% if user.is_authenticated %}<form method="post" action="{% url 'logout' %}">{% csrf_token %}<button>Sign out</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
