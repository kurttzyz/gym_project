{% extends "gyms/base.html" %}{% block content %}
<h1>Sign in</h1>
<form class="card" method="post">
  {% csrf_token %}{{ form.as_p }}<input
    type="hidden"
    name="next"
    value="{{ next }}"
  /><button>Sign in</button>
</form>
{% if tenant %}<p><a href="{% url 'member-reset-request' %}">Forgot your member password?</a></p>{% endif %}{% endblock %}
