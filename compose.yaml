services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: ${PGADMIN_PASSWORD:?Run scripts/init_dev_env.py first}
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
